<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EventQR — Thử camera tuần 1</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef2f6; color: #162338; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 760px; margin: 28px auto; padding: 24px; background: white; border-radius: 18px; }
    h1 { font-size: 26px; margin: 0 0 8px; }
    .note { color: #536274; }
    .buttons { display: flex; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
    button { border: 0; border-radius: 10px; padding: 12px 18px; font: inherit; cursor: pointer; }
    #start { background: #175cd3; color: white; }
    #stop { background: #e6ebf2; }
    button:disabled { opacity: .5; cursor: default; }
    video { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #101827; border-radius: 12px; }
    #status { border-left: 4px solid #175cd3; padding: 12px; background: #f0f5ff; overflow-wrap: anywhere; }
    dl { display: grid; grid-template-columns: 105px 1fr; gap: 8px; font-size: 14px; }
    dt { font-weight: 600; } dd { margin: 0; overflow-wrap: anywhere; }
    @media (max-width: 800px) { main { margin: 12px; padding: 18px; } }
  </style>
</head>
<body>
<main>
  <h1>EventQR · Thử camera</h1>
  <p class="note">Bài thử tuần 1: mở trang qua API Gateway HTTPS, cấp quyền camera và kiểm tra hình ảnh trên điện thoại.</p>
  <div class="buttons">
    <button id="start" type="button">Bật camera</button>
    <button id="stop" type="button" disabled>Tắt camera</button>
  </div>
  <video id="preview" autoplay muted playsinline aria-label="Hình ảnh camera"></video>
  <p id="status" role="status" aria-live="polite">Chưa bật camera.</p>
  <dl>
    <dt>Địa chỉ</dt><dd id="origin"></dd>
    <dt>HTTPS</dt><dd id="secure"></dd>
    <dt>Thời gian</dt><dd id="clock"></dd>
  </dl>
  <p class="note">Trang này chỉ thử camera, chưa giải mã QR và chưa gọi API check-in. Không gửi hình ảnh lên server.</p>
</main>
<script>
  const video = document.getElementById('preview');
  const start = document.getElementById('start');
  const stop = document.getElementById('stop');
  const status = document.getElementById('status');
  let stream = null;
  let requestVersion = 0;

  document.getElementById('origin').textContent = location.origin;
  document.getElementById('secure').textContent = location.protocol === 'https:'
    ? 'Có · HTTPS' : (window.isSecureContext ? 'Không · secure context cục bộ' : 'Không · cần mở bằng HTTPS');
  const updateClock = () => {
    document.getElementById('clock').textContent = new Date().toLocaleString('vi-VN', { timeZoneName: 'short' });
  };
  updateClock();
  setInterval(updateClock, 1000);

  function stopCamera(message = 'Đã tắt camera.') {
    requestVersion += 1;
    if (stream) stream.getTracks().forEach(track => track.stop());
    stream = null;
    video.srcObject = null;
    start.disabled = false;
    stop.disabled = true;
    status.textContent = message;
  }

  start.addEventListener('click', async () => {
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      status.textContent = 'Không truy cập được API camera. Hãy mở trang trực tiếp bằng HTTPS trên Chrome hoặc Safari.';
      return;
    }
    const version = ++requestVersion;
    start.disabled = true;
    stop.disabled = false;
    status.textContent = 'Đang xin quyền camera. Hãy chọn Cho phép trong thông báo của trình duyệt.';
    try {
      const received = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: 'environment' } }
      });
      if (version !== requestVersion) {
        received.getTracks().forEach(track => track.stop());
        return;
      }
      stream = received;
      video.srcObject = stream;
      await video.play();
      if (version === requestVersion) status.textContent = 'Đã bật camera. Kiểm tra khung hình rồi chụp minh chứng.';
    } catch (error) {
      if (version !== requestVersion) return;
      const messages = {
        NotAllowedError: 'Quyền camera bị từ chối. Cho phép camera trong cài đặt của trang rồi thử lại.',
        NotFoundError: 'Không tìm thấy camera trên thiết bị.',
        NotReadableError: 'Không mở được camera. Đóng ứng dụng đang dùng camera rồi thử lại.',
        OverconstrainedError: 'Thiết bị không đáp ứng cấu hình camera.'
      };
      stopCamera(messages[error.name] || `Không bật được camera (${error.name || 'lỗi không xác định'}).`);
    }
  });
  stop.addEventListener('click', () => stopCamera());
  window.addEventListener('pagehide', () => stopCamera());
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopCamera('Đã tắt camera khi chuyển khỏi trang. Bấm Bật camera để tiếp tục.');
  });
</script>
</body>
</html>
